<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" role="img" aria-label="UdmMonitor architecture">
  <title>UdmMonitor architecture — watch the watcher</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="880" height="330" rx="10" fill="#0d1117"/>

  <!-- ntfy transport node -->
  <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <rect x="330" y="20" width="90" height="30" fill="#555"/>
    <rect x="420" y="20" width="130" height="30" fill="#4c1"/>
    <text x="375" y="39" fill="#fff" text-anchor="middle">transport</text>
    <text x="485" y="39" fill="#fff" text-anchor="middle">ntfy.sh &#183; wss</text>
  </g>

  <!-- PC node -->
  <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif">
    <rect x="40" y="90" width="300" height="28" fill="#007ec6"/>
    <rect x="40" y="118" width="300" height="86" fill="#161b22" stroke="#30363d"/>
    <text x="190" y="109" fill="#fff" text-anchor="middle" font-size="12" font-weight="bold">THIS PC &#183; out-of-band</text>
    <text x="52" y="138" font-size="11" fill="#c9d1d9">UdmMonitor.exe &#8212; WPF tray</text>
    <text x="52" y="156" font-size="11" fill="#8b949e">ICMP prober &#183; debounced up/down</text>
    <text x="52" y="174" font-size="11" fill="#8b949e">ntfy wss subscriber &#183; toasts</text>
    <text x="52" y="192" font-size="11" fill="#8b949e">heartbeat watch &#183; jsonl ring log</text>
  </g>

  <!-- UDM node -->
  <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif">
    <rect x="540" y="90" width="300" height="28" fill="#00599c"/>
    <rect x="540" y="118" width="300" height="86" fill="#161b22" stroke="#30363d"/>
    <text x="690" y="109" fill="#fff" text-anchor="middle" font-size="12" font-weight="bold">UDM PRO &#183; in-band watchdog</text>
    <text x="552" y="138" font-size="11" fill="#c9d1d9">cam-watchdog.sh &#8212; boot hook</text>
    <text x="552" y="156" font-size="11" fill="#8b949e">camera ARP liveness on br3</text>
    <text x="552" y="174" font-size="11" fill="#8b949e">evil-twin &#183; IPS &#183; WPA drift</text>
    <text x="552" y="192" font-size="11" fill="#8b949e">daily heartbeat &#8594; ntfy</text>
  </g>

  <!-- arrows ntfy <-> nodes -->
  <g stroke="#8b949e" stroke-width="2" fill="none">
    <path d="M 690 90 L 690 35 L 556 35" marker-end="url(#arr)"/>
    <path d="M 330 35 L 190 35 L 190 90" marker-end="url(#arr)"/>
    <path d="M 340 160 L 536 160" marker-end="url(#arr)"/>
    <path d="M 120 204 L 120 244" marker-end="url(#arr)"/>
    <path d="M 720 204 L 720 244" marker-end="url(#arr)"/>
  </g>

  <!-- arrow labels -->
  <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="10" fill="#8b949e">
    <text x="700" y="60">push &#183; curl</text>
    <text x="196" y="28">subscribe &#183; sub-second</text>
    <text x="440" y="150" text-anchor="middle">icmp &#183; 5 s poll &#183; out-of-band eyes</text>
  </g>

  <!-- bottom badges -->
  <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <rect x="30" y="248" width="56" height="24" fill="#555"/><rect x="86" y="248" width="150" height="24" fill="#fe7d37"/>
    <text x="58" y="264" fill="#fff" text-anchor="middle">alerts</text>
    <text x="161" y="264" fill="#fff" text-anchor="middle">windows toasts</text>

    <rect x="580" y="248" width="56" height="24" fill="#555"/><rect x="636" y="248" width="164" height="24" fill="#007ec6"/>
    <text x="608" y="264" fill="#fff" text-anchor="middle">phone</text>
    <text x="718" y="264" fill="#fff" text-anchor="middle">ntfy app push</text>
  </g>

  <text x="440" y="308" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="12" font-style="italic" fill="#8b949e" text-anchor="middle">the console can&#8217;t watch itself &#8212; this PC can &#183; watch the watcher</text>
</svg>
