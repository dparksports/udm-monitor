name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish app/src/UdmMonitor.App/UdmMonitor.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Zip
        run: Compress-Archive -Path publish/* -DestinationPath UdmMonitor-win-x64.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: UdmMonitor-win-x64.zip
          generate_release_notes: true
