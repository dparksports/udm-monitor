# cam-watchdog configuration - re-read every cycle, edits apply live
NTFY_URL=https://ntfy.sh/udm9-bbfe760697f194d8b211305c

# Monitored cameras: space-separated ip@bridge entries. Examples:
#   CAMS="192.168.3.146@br3 192.168.2.74@br2"
CAMS="192.168.3.146@br3"

# Your SSID names - an unknown AP broadcasting any of these = evil-twin alert
WATCH_SSIDS="Starlink Home element-72c70e097156682e"

# thresholds
POLL_SECS=10
OFFLINE_MISS_LIMIT=3
REALERT_SECS=600
ROGUE_POLL_SECS=60
ROGUE_REALERT_SECS=3600
HEARTBEAT_SECS=86400

# threat-blocked notifications from the IPS engine (1=on)
IPS_ENABLED=1

# wifi security drift watch: alert if any user SSID leaves wpa3
# (system SSIDs excluded; transition mode counts as OK if allowed below)
WPA_WATCH_ENABLED=1
WPA_EXPECTED_MODE=wpa3
WPA_ALLOW_TRANSITION=1
